[defaults]
# Silences interpreter discovery warnings across all hosts
interpreter_python = auto_silent

# Filters out non-fatal OSC terminal signaling noise from output logs
warning_filters =
    - "Module invocation had junk after the JSON data"
    - "is using the discovered Python interpreter at"

[ssh_connection]
# Enables SSH pipelining (reduces SSH round-trips)
pipelining = True

[privilege_escalation]
become_flags = -H -S