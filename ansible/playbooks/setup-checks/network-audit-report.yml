---
# ----------------------------------------------------------------------
# PLAY 1: Gather facts on all hosts
# ----------------------------------------------------------------------
- name: 1. Collect networking, DNS, and /etc/hosts details
  hosts: all
  gather_facts: yes
  ignore_unreachable: yes
  become: false
  vars:
    ansible_timeout: 30
    ansible_become_timeout: 30

  tasks:
    - name: Read /etc/hosts content
      ansible.builtin.slurp:
        src: /etc/hosts
      register: hosts_file_raw
      ignore_errors: yes

    - name: Parse /etc/hosts entries
      ansible.builtin.set_fact:
        custom_hosts_summary: >-
          {{
            hosts_file_raw.content
            | default('')
            | b64decode
            | regex_findall('(?m)^(?!#|[ \t]*$)(.+)$')
            | map('regex_replace', '\s+', ' ')
            | join(' <br> ')
            | default('None/Empty', true)
          }}

    - name: Compile network facts per host
      ansible.builtin.set_fact:
        host_net_info:
          hostname: "{{ inventory_hostname }}"
          default_ip: "{{ ansible_facts.get('default_ipv4', {}).get('address', 'No IPv4') }}"
          interface: "{{ ansible_facts.get('default_ipv4', {}).get('interface', 'N/A') }}"
          gateway: "{{ ansible_facts.get('default_ipv4', {}).get('gateway', 'N/A') }}"
          dns_nameservers: "{{ ansible_facts.get('dns', {}).get('nameservers', []) | join(', ') | default('None', true) }}"
          dns_domains: >-
            {{
              (
                ansible_facts.get('dns', {}).get('search', [])
                +
                ([ansible_facts.get('dns', {}).get('domain')] if ansible_facts.get('dns', {}).get('domain') else [])
              )
              | unique
              | join(', ')
              | default('None', true)
            }}
          hosts_entries: "{{ custom_hosts_summary | default('None/Empty', true) }}"

    # NOTICE: The race-prone "Track reachable host on localhost" task is removed entirely!


# ----------------------------------------------------------------------
# PLAY 2: Assemble table cleanly from hostvars
# ----------------------------------------------------------------------
- name: 2. Build and display the network report table on the control node
  hosts: localhost
  gather_facts: no
  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Build report list using native play inventory
      ansible.builtin.set_fact:
        report_data: >-
          {{
            groups['all']
            | map('extract', hostvars, 'host_net_info')
            | select('defined')
            | list
          }}

    - name: Display formatted Markdown table
      ansible.builtin.debug:
        msg: |
          | Host | Primary IP (Iface) | Gateway | DNS Nameservers | Search Domains | /etc/hosts Entries |
          | :--- | :--- | :--- | :--- | :--- | :--- |
          {% for h in report_data | default([]) %}
          | {{ h.hostname }} | {{ h.default_ip }} ({{ h.interface }}) | {{ h.gateway }} | {{ h.dns_nameservers }} | {{ h.dns_domains }} | {{ h.hosts_entries }} |
          {% endfor %}

    - name: Display formatted Markdown table
      ansible.builtin.command:
        cmd: "python3 -c 'import sys; sys.stdout.write(sys.stdin.read())'"
        stdin: |
          | Host | Primary IP (Iface) | Gateway | DNS Nameservers | Search Domains | /etc/hosts Entries |
          | :--- | :--- | :--- | :--- | :--- | :--- |
          {% for h in report_data | default([]) %}
          | {{ h.hostname }} | {{ h.default_ip }} ({{ h.interface }}) | {{ h.gateway }} | {{ h.dns_nameservers }} | {{ h.dns_domains }} | {{ h.hosts_entries }} |
          {% endfor %}
      changed_when: false      

    - name: Generate clean Markdown report file
      ansible.builtin.copy:
        dest: /tmp/network_audit_report.md
        content: |
          # Fleet Network Audit Report

          | Host | Primary IP (Iface) | Gateway | DNS Nameservers | Search Domains | /etc/hosts Entries |
          | :--- | :--- | :--- | :--- | :--- | :--- |
          {% for h in report_data | default([]) %}
          | {{ h.hostname }} | {{ h.default_ip }} ({{ h.interface }}) | {{ h.gateway }} | {{ h.dns_nameservers }} | {{ h.dns_domains }} | {{ h.hosts_entries }} |
          {% endfor %}

    - name: Print raw table to stdout
      ansible.builtin.command:
        cmd: cat /tmp/network_audit_report.md
      register: table_out
      changed_when: false

    - name: Output raw table lines
      ansible.builtin.debug:
        var: table_out.stdout_lines      