---
- name: 1. Collect networking, DNS, and /etc/hosts details
  hosts: all
  gather_facts: yes
  ignore_unreachable: yes

  tasks:
    - name: Read /etc/hosts content
      ansible.builtin.slurp:
        src: /etc/hosts
      register: hosts_file_raw
      ignore_errors: yes

    - name: Parse /etc/hosts entries
      ansible.builtin.set_fact:
        custom_hosts_summary: >-
          {{
            hosts_file_raw.content
            | default('')
            | b64decode
            | regex_findall('(?m)^(?!#|[ \t]*$)(.+)$')
            | map('regex_replace', '\s+', ' ')
            | join(' <br> ')
            | default('None/Empty', true)
          }}

    - name: Compile network facts per host
      ansible.builtin.set_fact:
        host_net_info:
          hostname: "{{ inventory_hostname }}"
          default_ip: "{{ ansible_default_ipv4.address | default('No IPv4') }}"
          interface: "{{ ansible_default_ipv4.interface | default('N/A') }}"
          gateway: "{{ ansible_default_ipv4.gateway | default('N/A') }}"
          dns_nameservers: "{{ ansible_dns.nameservers | default([]) | join(', ') | default('None', true) }}"
          dns_domains: "{{ (ansible_dns.search | default([]) + ansible_dns.domain | default([])) | unique | join(', ') | default('None', true) }}"
          hosts_entries: "{{ custom_hosts_summary }}"

    - name: Track reachable host on localhost
      ansible.builtin.set_fact:
        reachable_hosts: "{{ hostvars['localhost']['reachable_hosts'] | default([]) + [inventory_hostname] }}"
      delegate_to: localhost
      delegate_facts: yes


- name: 2. Build and display the network report table on the control node
  hosts: localhost
  gather_facts: no
  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Build report list from reachable hosts
      ansible.builtin.set_fact:
        report_data: >-
          {{ report_data | default([]) + [hostvars[item]['host_net_info']] }}
      loop: "{{ hostvars['localhost']['reachable_hosts'] | default([]) }}"
      when: hostvars[item]['host_net_info'] is defined

    - name: Display formatted Markdown table
      ansible.builtin.debug:
        msg: >-
          [
            "| Host | Primary IP (Iface) | Gateway | DNS Nameservers | Search Domains | /etc/hosts Entries |",
            "| :--- | :--- | :--- | :--- | :--- | :--- |"
            {% for h in report_data | default([]) %}
            , "| {{ h.hostname }} | {{ h.default_ip }} ({{ h.interface }}) | {{ h.gateway }} | {{ h.dns_nameservers }} | {{ h.dns_domains }} | {{ h.hosts_entries }} |"
            {% endfor %}
          ]