---
- name: 1. Gather facts and timer status for reachable remote hosts
  hosts: all
  gather_facts: true
  ignore_unreachable: true
  ignore_errors: true

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto
      become: true
      ignore_errors: true

    - name: Query systemd for DNF automatic timer status and timings
      ansible.builtin.command: >
        systemctl show -p Id -p ActiveState -p UnitFileState -p NextElapseUSecRealtime -p LastTriggerUSecRealtime
        dnf5-automatic.timer dnf-automatic.timer
      register: timer_raw
      changed_when: false
      failed_when: false

    - name: Parse timer properties
      ansible.builtin.set_fact:
        timer_info: >-
          {%- set active_timer = {} -%}
          {%- set raw_out = timer_raw.stdout | default('') -%}
          {%- for block in raw_out.split('\n\n') if block | trim != '' -%}
            {%- set d = {} -%}
            {%- for line in block.splitlines() if '=' in line -%}
              {%- set parts = line.split('=', 1) -%}
              {%- set _ = d.update({parts[0]: parts[1]}) -%}
            {%- endfor -%}
            {%- if d.get('ActiveState') == 'active' or active_timer == {} -%}
              {%- set _ = active_timer.update(d) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ active_timer }}
      when:
        - timer_raw is defined
        - timer_raw.stdout is defined

    - name: Set host details as a fact
      ansible.builtin.set_fact:
        host_info:
          hostname: "{{ ansible_facts['hostname'] | default(inventory_hostname) }}"
          os_version: "{{ ansible_facts['distribution'] | default('Unknown') }} {{ ansible_facts['distribution_version'] | default('') }}"
          kernel_version: "{{ ansible_facts['kernel'] | default('Unknown') }}"
          dnf_pkg_status: >-
            {%- set pkgs = ansible_facts.packages | default({}) -%}
            {%- if 'dnf5-plugin-automatic' in pkgs -%}
            DNF5 Plugin ✅
            {%- elif 'dnf5-automatic' in pkgs -%}
            DNF5 Auto ✅
            {%- elif 'dnf-automatic' in pkgs -%}
            DNF4 Auto ✅
            {%- else -%}
            Not Installed ❌
            {%- endif -%}
          timer_status: >-
            {%- set t = timer_info | default({}) -%}
            {%- set state = t.get('ActiveState', 'inactive') -%}
            {%- set fstate = t.get('UnitFileState', '') | trim or 'disabled' -%}
            {%- if state == 'active' -%}
            Active ({{ fstate }}) ●
            {%- elif t.get('Id') is defined and t.get('Id') != '' -%}
            {{ state | capitalize }} ({{ fstate }}) ○
            {%- else -%}
            Missing ○
            {%- endif -%}
          timer_next: "{{ (timer_info | default({})).get('NextElapseUSecRealtime') | default('N/A', true) | trim or 'N/A' }}"
          timer_last: "{{ (timer_info | default({})).get('LastTriggerUSecRealtime') | default('Never', true) | trim or 'Never' }}"

    - name: Save list of reachable hosts on controller
      ansible.builtin.set_fact:
        reachable_hosts: "{{ ansible_play_hosts }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: Clear errors so play exits successfully
      ansible.builtin.meta: clear_host_errors


- name: 2. Build and display the table on the control node
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Build clean markdown table lines
      ansible.builtin.set_fact:
        markdown_lines: >-
          {%- set lines = [
            "| Server | OS | Kernel | Package | Timer State | Next Scheduled Run | Last Trigger |",
            "| :--- | :--- | :--- | :--- | :--- | :--- | :--- |"
          ] -%}
          {%- for h in (hostvars['localhost']['reachable_hosts'] | default([])) -%}
            {%- set info = hostvars[h].get('host_info') -%}
            {%- if info is defined and info -%}
              {%- set row = "| " ~ info.hostname ~ " | " ~ info.os_version ~ " | " ~ info.kernel_version ~ " | " ~ (info.dnf_pkg_status | trim) ~ " | " ~ (info.timer_status | trim) ~ " | " ~ info.timer_next ~ " | " ~ info.timer_last ~ " |" -%}
              {%- set _ = lines.append(row) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ lines }}

    - name: Display report table
      ansible.builtin.debug:
        msg: "{{ markdown_lines | join('\n') }}"