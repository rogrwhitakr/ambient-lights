---
- name: 1. Gather facts and timer status for reachable remote hosts
  hosts: all
  gather_facts: yes
  ignore_unreachable: yes

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Query systemd for DNF automatic timer status and timings
      ansible.builtin.command: >
        systemctl show -p Id -p ActiveState -p UnitFileState -p NextElapseUSecRealtime -p LastTriggerUSecRealtime
        dnf5-automatic.timer dnf-automatic.timer
      register: timer_raw
      changed_when: false
      failed_when: false

    - name: Parse timer properties
      ansible.builtin.set_fact:
        timer_info: >-
          {%- set active_timer = {} -%}
          {%- for block in timer_raw.stdout.split('\n\n') if block | trim != '' -%}
            {%- set d = {} -%}
            {%- for line in block.splitlines() if '=' in line -%}
              {%- set parts = line.split('=', 1) -%}
              {%- set _ = d.update({parts[0]: parts[1]}) -%}
            {%- endfor -%}
            {%- if d.get('ActiveState') == 'active' or active_timer == {} -%}
              {%- set _ = active_timer.update(d) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ active_timer }}

    - name: Set host details as a fact
      ansible.builtin.set_fact:
        host_info:
          hostname: "{{ ansible_hostname }}"
          os_version: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel_version: "{{ ansible_kernel }}"
          dnf_pkg_status: >-
            {% if 'dnf5-plugin-automatic' in ansible_facts.packages %}
            DNF5 Plugin ✅
            {% elif 'dnf5-automatic' in ansible_facts.packages %}
            DNF5 Auto ✅
            {% elif 'dnf-automatic' in ansible_facts.packages %}
            DNF4 Auto ✅
            {% else %}
            Not Installed ❌
            {% endif %}
          timer_status: >-
            {% set state = timer_info.get('ActiveState', 'inactive') %}
            {% set fstate = timer_info.get('UnitFileState', '') | trim or 'disabled' %}
            {% if state == 'active' %}
            Active ({{ fstate }}) ●
            {% elif timer_info.get('Id') is defined and timer_info.get('Id') != '' %}
            {{ state | capitalize }} ({{ fstate }}) ○
            {% else %}
            Missing ○
            {% endif %}
          timer_next: "{{ timer_info.get('NextElapseUSecRealtime') | default('N/A', true) | trim or 'N/A' }}"
          timer_last: "{{ timer_info.get('LastTriggerUSecRealtime') | default('Never', true) | trim or 'Never' }}"

    - name: Save list of reachable hosts on controller
      ansible.builtin.set_fact:
        reachable_hosts: "{{ ansible_play_hosts }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: Clear errors so play exits successfully
      meta: clear_host_errors

- name: 2. Build and display the table on the control node
  hosts: localhost
  gather_facts: no
  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Build the reporting list from reachable hosts only
      ansible.builtin.set_fact:
        report_data: >-
          {{ report_data | default([]) + [hostvars[item]['host_info']] }}
      loop: "{{ hostvars['localhost']['reachable_hosts'] | default([]) }}"

    - name: Display table on the control node
      ansible.builtin.debug:
        msg: >-
          [
            "| Server | OS | Kernel | Package | Timer State | Next Scheduled Run | Last Trigger |",
            "| :--- | :--- | :--- | :--- | :--- | :--- | :--- |"
            {% for h in report_data | default([]) %}
            , "| {{ h.hostname }} | {{ h.os_version }} | {{ h.kernel_version }} | {{ h.dnf_pkg_status | trim }} | {{ h.timer_status | trim }} | {{ h.timer_next }} | {{ h.timer_last }} |"
            {% endfor %}
          ]