---
- name: Patch and maintain DNF-based systems
  hosts: all
  become: true
  serial: "20%"

  tasks:
    - name: Ensure play runs only on DNF-managed hosts
      ansible.builtin.meta: end_host
      when: ansible_facts['pkg_mgr'] not in ['dnf', 'dnf5']

    # --- Duplicate Detection & Remediation ---
    - name: Check for duplicate packages in RPM database
      ansible.builtin.command:
        cmd: dnf check duplicates
      register: dnf_duplicate_check
      changed_when: false
      failed_when: false

    - name: Remediate duplicate packages and sync system
      when: dnf_duplicate_check.rc != 0
      block:
        - name: Remove duplicates via DNF4/DNF
          ansible.builtin.shell: |
            if command -v dnf4 >/dev/null 2>&1; then
              dnf4 remove -y --duplicates
            else
              dnf remove -y --duplicates || dnf reinstall -y $(dnf repoquery --duplicates --latest-limit=1 -q)
            fi
          changed_when: true

        - name: Run distro synchronization with cache refresh
          ansible.builtin.command:
            cmd: dnf distro-sync -y --refresh
          changed_when: true

    # --- System Upgrade ---
    - name: Upgrade all installed packages (DNF / DNF5)
      ansible.builtin.package:
        name: "*"
        state: latest
        update_cache: true
        exclude: "{{ ['postgresql*', 'pg_*'] if 'database_nodes' in group_names else [] }}"
      register: update_result

    - name: Display updated packages
      ansible.builtin.debug:
        msg: "{{ update_result.results | to_nice_yaml }}"
      when:
        - update_result.changed
        - update_result.results is defined

    # --- Reboot Verification ---
    - name: Ensure reboot check tools are present
      ansible.builtin.package:
        name: "{{ 'dnf5-plugins' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf-plugins-core' }}"
        state: present

    - name: Check if reboot is required
      ansible.builtin.command:
        cmd: dnf needs-restarting -r
      register: reboot_check
      changed_when: false
      failed_when: reboot_check.rc not in [0, 1]

    - name: Schedule one-off reboot at 3:00 AM
      ansible.builtin.command:
        cmd: shutdown -r 03:00 "System reboot scheduled for updates"
      when: reboot_check.rc == 1