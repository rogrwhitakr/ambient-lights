---
# -------------------------------------------------------------
# PHASE 1: Sequential dist-upgrade across all nodes
# -------------------------------------------------------------
- name: Proxmox Cluster Sequential Package Upgrades
  hosts: all
  become: true
  serial: 1
  gather_facts: true

  tasks:
    - name: Clean package lists and remove unused packages
      ansible.builtin.apt:
        autoremove: true
        purge: true
        update_cache: true

    - name: Upgrade all packages (dist-upgrade)
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true
      register: upgrade_result

    - name: Check if kernel reboot is flagged
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: false
      register: reboot_needed

    - name: Record reboot requirement fact
      ansible.builtin.set_fact:
        node_needs_reboot: "{{ reboot_needed.stat.exists or upgrade_result.changed }}"

# -------------------------------------------------------------
# PHASE 2: Parallel 03:00 AM Scheduled Reboot (All Nodes)
# -------------------------------------------------------------
- name: Schedule Synchronized Nightly Reboot
  hosts: all
  become: true
  serial: 0
  gather_facts: false

  vars:
    # Set to true via Semaphore / CLI: -e "schedule_reboot=true"
    schedule_reboot: false
    reboot_time: "03:00"

  tasks:
    - name: Check if any cluster node flagged a reboot requirement
      ansible.builtin.set_fact:
        cluster_reboot_required: "{{ hostvars | dict2items | map(attribute='value.node_needs_reboot') | select('defined') | select('equalto', true) | list | length > 0 }}"
      run_once: true

    - name: Display scheduled maintenance decision
      ansible.builtin.debug:
        msg: "Cluster reboot required: {{ cluster_reboot_required }}. Scheduling for {{ reboot_time }}."
      when:
        - schedule_reboot | bool
        - cluster_reboot_required | bool

    - name: Schedule clean guest shutdown and host reboot at target time
      ansible.builtin.shell: |
        # Cancel any previous scheduled shutdown
        /usr/sbin/shutdown -c 2>/dev/null || true
        # Schedule reboot (Proxmox systemd automatically sends SIGPWR/ACPI shutdown to guests)
        /usr/sbin/shutdown -r {{ reboot_time }} "Scheduled Proxmox cluster maintenance reboot"
      when:
        - schedule_reboot | bool
        - cluster_reboot_required | bool
      changed_when: true