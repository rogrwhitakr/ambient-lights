---
# roles/common/tasks/20_harden-ssh.yml
- name: Ensure SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy modern hardened sshd drop-in configuration
  ansible.builtin.template:
    src: sshd_hardened.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardened.conf
    owner: root
    group: root
    mode: '0600'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload sshd