---
- name: Rebuild /etc/hosts with structured loopback and IPv6 entries
  ansible.builtin.copy:
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      # northernlights.one
      # ipv4
      127.0.0.1   localhost localhost.localdomain localhost4 localhost4.localdomain4
      127.0.1.1   {{ inventory_hostname }} {{ inventory_hostname.split('.')[0] }}

      # ipv6
      ::1         localhost localhost.localdomain localhost6 localhost6.localdomain6
      ::1         {{ inventory_hostname }} {{ inventory_hostname.split('.')[0] }}