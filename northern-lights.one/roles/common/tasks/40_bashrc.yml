---
# roles/common/tasks/40_bashrc.yml
- name: Ensure /etc/profile.d directory exists
  ansible.builtin.file:
    path: /etc/profile.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy custom profile.d scripts for all users
  ansible.builtin.copy:
    src: profile.d/
    dest: /etc/profile.d/
    owner: root
    group: root
    mode: '0644'

- name: Clean up legacy home directory scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/home/{{ ansible_user }}/profile-setup.bash"
    - "/home/{{ ansible_user }}/.bashrc.d"