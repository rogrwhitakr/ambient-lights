---
- name: Ensure target host is running Fedora
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Fedora'
    fail_msg: "This role is designed for Fedora systems."
    quiet: true

- name: Determine DNF package and timer unit name based on Fedora version
  ansible.builtin.set_fact:
    dnf_automatic_pkg_name: "{{ 'dnf5-plugin-automatic' if (ansible_facts['distribution_major_version'] | int >= 41) else 'dnf-automatic' }}"
    dnf_automatic_timer_unit: "{{ 'dnf5-automatic.timer' if (ansible_facts['distribution_major_version'] | int >= 41) else 'dnf-automatic.timer' }}"

- name: Install DNF automatic package
  ansible.builtin.dnf:
    name: "{{ dnf_automatic_pkg_name }}"
    state: present

- name: Deploy /etc/dnf/automatic.conf configuration
  ansible.builtin.template:
    src: automatic.conf.j2
    dest: /etc/dnf/automatic.conf
    owner: root
    group: root
    mode: "0644"

- name: Create systemd override directory for timer
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ dnf_automatic_timer_unit }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy systemd timer override for 03:00 execution
  ansible.builtin.template:
    src: timer-override.conf.j2
    dest: "/etc/systemd/system/{{ dnf_automatic_timer_unit }}.d/override.conf"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart dnf automatic timer

- name: Flush handlers to trigger daemon-reload before service management
  ansible.builtin.meta: flush_handlers

- name: Enable and start the DNF automatic timer
  ansible.builtin.systemd_service:
    name: "{{ dnf_automatic_timer_unit }}"
    enabled: true
    state: started